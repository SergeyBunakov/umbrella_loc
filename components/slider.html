<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Slider_component</title>
  </head>
  <body>
    <section>
      <div
        id="carouseCarouselCaptions"
        class="relative"
        data-twe-carousel-init
        data-twe-carousel-slide
      >
        <div
          class="absolute bottom-0 left-0 right-0 z-[2] mx-[15%] mb-4 flex list-none justify-center p-0"
          data-twe-carousel-indicators
        >
          <button
            type="button"
            data-twe-target="#carouseCarouselCaptions"
            data-twe-slide-to="0"
            data-twe-carousel-active
            class="mx-[3px] box-content h-[3px] w-[30px] flex-initial cursor-pointer border-0 border-y-[10px] border-solid border-transparent bg-white bg-clip-padding p-0 -indent-[999px] opacity-50 transition-opacity duration-[600ms] ease-[cubic-bezier(0.25,0.1,0.25,1.0)] motion-reduce:transition-none"
            aria-current="true"
            aria-label="Slide 1"
          ></button>
          <button
            type="button"
            data-twe-target="#carouseCarouselCaptions"
            data-twe-slide-to="1"
            class="mx-[3px] box-content h-[3px] w-[30px] flex-initial cursor-pointer border-0 border-y-[10px] border-solid border-transparent bg-white bg-clip-padding p-0 -indent-[999px] opacity-50 transition-opacity duration-[600ms] ease-[cubic-bezier(0.25,0.1,0.25,1.0)] motion-reduce:transition-none"
            aria-label="Slide 2"
          ></button>
          <button
            type="button"
            data-twe-target="#carouseCarouselCaptions"
            data-twe-slide-to="2"
            class="mx-[3px] box-content h-[3px] w-[30px] flex-initial cursor-pointer border-0 border-y-[10px] border-solid border-transparent bg-white bg-clip-padding p-0 -indent-[999px] opacity-50 transition-opacity duration-[600ms] ease-[cubic-bezier(0.25,0.1,0.25,1.0)] motion-reduce:transition-none"
            aria-label="Slide 3"
          ></button>
        </div>
        <div
          class="relative w-full overflow-hidden after:clear-both after:block after:content-['']"
        >
          <div
            class="relative float-left -mr-[100%] hidden w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
            data-twe-carousel-active
            data-twe-carousel-item
            style="backface-visibility: hidden"
          >
            <div
              class="relative overflow-hidden bg-cover bg-no-repeat"
              style="background-position: 50%"
            >
              <img
                src="https://tecdn.b-cdn.net/img/Photos/Slides/img%20(123).jpg"
                class="block w-full"
              />

              <!--					<img src="./img/hero/carousel/marciques.png" alt="" class="block w-full">-->

              <div
                class="absolute bottom-0 left-0 right-0 top-0 h-full w-full overflow-hidden bg-black bg-fixed opacity-50"
              ></div>
            </div>
            <div
              class="absolute inset-x-[15%] top-0 bottom-0 flex flex-col text-center items-center text-white"
            >
              <div class="my-auto">
                <div>
                  <h2 class="text-4xl mb-4">First slide label</h2>
                </div>
                <div>
                  <p>
                    Some representative placeholder content for the first slide.
                  </p>
                </div>
                <div>
                  <button
                    id="modal-btn-one"
                    class="rounded-lg bg-green-500 px-4 text-sm font-medium text-green-50 py-2.5 hover:bg-green-800 hover:text-white mt-14"
                  >
                    Зробити замовлення
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            class="relative float-left -mr-[100%] hidden w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
            data-twe-carousel-item
            style="backface-visibility: hidden"
          >
            <div
              class="relative overflow-hidden bg-cover bg-no-repeat"
              style="background-position: 50%"
            >
              <img
                src="https://tecdn.b-cdn.net/img/Photos/Slides/img%20(124).jpg"
                class="block w-full"
              />
              <!--					<img src="./img/hero/carousel/pergola.png" alt="" class="block w-full">-->
              <div
                class="absolute bottom-0 left-0 right-0 top-0 h-full w-full overflow-hidden bg-black bg-fixed opacity-50"
              ></div>
            </div>
            <div
              class="absolute inset-x-[15%] top-0 bottom-0 flex flex-col text-center items-center text-white"
            >
              <div class="my-auto">
                <div>
                  <h2 class="text-4xl mb-4">Second slide label</h2>
                </div>
                <div>
                  <p>
                    Some representative placeholder content for the first slide.
                  </p>
                </div>
                <div>
                  <button
                    class="rounded-lg bg-green-500 px-4 text-sm font-medium text-green-50 py-2.5 hover:bg-green-800 hover:text-white mt-14"
                  >
                    Зробити замовлення
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div
            class="relative float-left -mr-[100%] hidden w-full transition-transform duration-[600ms] ease-in-out motion-reduce:transition-none"
            data-twe-carousel-item
            style="backface-visibility: hidden"
          >
            <div
              class="relative overflow-hidden bg-cover bg-no-repeat"
              style="background-position: 50%"
            >
              <img
                src="https://tecdn.b-cdn.net/img/Photos/Slides/img%20(125).jpg"
                class="block w-full"
              />
              <!--					<img src="./img/hero/carousel/parasolya.png" alt="" class="block w-full">-->
              <div
                class="absolute bottom-0 left-0 right-0 top-0 h-full w-full overflow-hidden bg-black bg-fixed opacity-50"
              ></div>
            </div>
            <div
              class="absolute inset-x-[15%] top-0 bottom-0 flex flex-col text-center items-center text-white"
            >
              <div class="my-auto">
                <div>
                  <h2 class="text-4xl mb-4">Third slide label</h2>
                </div>
                <div>
                  <p>
                    Some representative placeholder content for the first slide.
                  </p>
                </div>
                <div>
                  <button
                    class="rounded-lg bg-green-500 px-4 text-sm font-medium text-green-50 py-2.5 hover:bg-green-800 hover:text-white mt-14"
                  >
                    Зробити замовлення
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <button
          class="absolute bottom-0 left-0 top-0 z-[1] flex w-[15%] items-center justify-center border-0 bg-none p-0 text-center text-white opacity-50 transition-opacity duration-150 ease-[cubic-bezier(0.25,0.1,0.25,1.0)] hover:text-white hover:no-underline hover:opacity-90 hover:outline-none focus:text-white focus:no-underline focus:opacity-90 focus:outline-none motion-reduce:transition-none"
          type="button"
          data-twe-target="#carouseCarouselCaptions"
          data-twe-slide="prev"
        >
          <span class="inline-block h-8 w-8">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-6 w-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 19.5L8.25 12l7.5-7.5"
              />
            </svg>
          </span>
          <span
            class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
            >Previous</span
          >
        </button>
        <button
          class="absolute bottom-0 right-0 top-0 z-[1] flex w-[15%] items-center justify-center border-0 bg-none p-0 text-center text-white opacity-50 transition-opacity duration-150 ease-[cubic-bezier(0.25,0.1,0.25,1.0)] hover:text-white hover:no-underline hover:opacity-90 hover:outline-none focus:text-white focus:no-underline focus:opacity-90 focus:outline-none motion-reduce:transition-none"
          type="button"
          data-twe-target="#carouseCarouselCaptions"
          data-twe-slide="next"
        >
          <span class="inline-block h-8 w-8">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-6 w-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M8.25 4.5l7.5 7.5-7.5 7.5"
              />
            </svg>
          </span>
          <span
            class="!absolute !-m-px !h-px !w-px !overflow-hidden !whitespace-nowrap !border-0 !p-0 ![clip:rect(0,0,0,0)]"
            >Next</span
          >
        </button>
      </div>
    </section>

    <script src="./js/tw-elements.umd.min.js"></script>
  </body>
</html>
