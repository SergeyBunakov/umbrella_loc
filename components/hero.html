<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Hero Section</title>
  </head>
  <body>
    <section class="bg-gray-50 py-12 lg:py-20">
      <div
        class="container mx-auto px-6 lg:px-12 grid grid-cols-1 lg:grid-cols-2 gap-8 items-center"
      >
        <!-- Text Content -->
        <div>
          <h1 class="text-4xl lg:text-5xl font-bold text-gray-800 mb-6">
            Створюємо комфорт для вашого простору
          </h1>
          <p class="text-lg text-gray-600 mb-8">
            Наші маркізи, перголи, вуличні зонтики та літні майданчики
            перетворять будь-який простір на оазу комфорту та стилю. Надійність,
            естетика та інноваційність — усе для вашого комфорту.
          </p>
          <a
            href="#"
            class="bg-blue-600 text-white px-6 py-3 rounded-md shadow-md hover:bg-blue-700"
          >
            Замовити консультацію
          </a>
        </div>
        <!-- Image Content -->
        <div class="flex justify-center">
          <img
            src="https://via.placeholder.com/600x400"
            alt="Продукція: маркізи, перголи, зонтики"
            class="rounded-lg shadow-lg max-w-full h-auto"
          />
        </div>
      </div>
    </section>
  </body>
</html>
